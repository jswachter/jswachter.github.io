<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos — Jonatan S. Wächter</title>
    <meta name="description" content="A collection of landscape photographs on Jonatan S. Wächter's personal website.">
    <style>
        html {
            background-color: #ffffff;
            box-sizing: border-box;
        }
        *, *::before, *::after {
            box-sizing: inherit;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            background-color: #ffffff;
            color: #333;
        }
        h1 {
            font-weight: 400;
        }
        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 48px clamp(20px, 6vw, 40px) 96px;
        }
        .back-link {
            margin-bottom: 14px;
        }
        a {
            color: #0077cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            margin-bottom: 5px;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }
        .photo-grid a {
            display: block;
        }
        .photo-grid img {
            display: block;
            width: 100%;
            height: auto;
        }
        @media (max-width: 600px) {
            .photo-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="back-link">
            <a href="index.html">← Main page</a>
        </div>
        <header>
            <h1>Photos</h1>
        </header>
        <div class="photo-grid">
            <a href="images/home-mountain-left-square.png" target="_blank" rel="noopener noreferrer">
                <img src="images/home-mountain-left-square.png" alt="Snow-covered mountains reflected in a lake" width="800" height="800">
            </a>
            <a href="images/home-sunset-square.jpeg" target="_blank" rel="noopener noreferrer">
                <img src="images/home-sunset-square.jpeg" alt="Pink and orange sunset over a river and city rooftops" width="2439" height="2439">
            </a>
            <a href="images/home-sunset-lake-square.jpeg" target="_blank" rel="noopener noreferrer">
                <img src="images/home-sunset-lake-square.jpeg" alt="Orange sun setting over mountain ridges and lakes" width="1254" height="1254" loading="lazy">
            </a>
            <a href="images/home-mountain-right-square.png" target="_blank" rel="noopener noreferrer">
                <img src="images/home-mountain-right-square.png" alt="Rocky peaks and snow reflected in a still mountain lake" width="800" height="800" loading="lazy">
            </a>
        </div>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notebook Entry</title>
    <link rel="alternate" type="application/json" title="Notebook index" href="notebooks/notebook-index.json">
    <script src="https://cdn.jsdelivr.net/npm/marked@17.0.5/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-footnote@1.4.0/dist/index.umd.js"></script>
    <script>
        window.MathJax = {
            tex: {
                tags: 'ams',
                tagSide: 'right',
                processEnvironments: true,
                packages: { '[+]': ['ams'] }
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>
    <style>
        html {
            background-color: #ffffff;
            box-sizing: border-box;
        }
        *, *::before, *::after {
            box-sizing: inherit;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            background-color: #ffffff;
            color: #333;
            overflow-x: hidden;
        }
        h1, h2 { 
            color: #333;
            font-weight: 400;
        }
        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 48px clamp(20px, 6vw, 40px) 96px;
        }
        .back-link {
            margin-bottom: 14px;
        }
        .back-link a {
            color: #555;
            text-decoration: underline;
            text-decoration-color: #ccc;
            text-underline-offset: 3px;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .entry-nav {
            display: flex;
            gap: 12px;
        }
        .entry-footer {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 40px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }
        .entry-footer[hidden] {
            display: none;
        }
        .entry-footer a {
            color: #555;
            text-decoration: underline;
            text-decoration-color: #ccc;
            text-underline-offset: 3px;
            font-size: 14px;
        }
        .entry-footer a:hover {
            text-decoration: underline;
        }
        .entry-header {
            margin: 30px 0 28px;
        }
        .entry-header h1 {
            margin: 0 0 8px;
            font-size: 28px;
            line-height: 1.3;
        }
        .entry-meta {
            color: #888;
            font-size: 13px;
            margin: 0;
        }
        .entry-meta a {
            color: inherit;
            text-decoration: none;
        }
        .entry-meta a:hover {
            text-decoration: underline;
        }
        .entry-body {
            position: relative;
        }
        .entry-sections {
            display: none;
        }
        #content {
            position: relative;
            font-family: "Iowan Old Style", Georgia, serif;
            color: #333;
            line-height: 1.8;
        }
        #content h1, #content h2, #content h3 {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        }
        #content h2, #content h3 {
            scroll-margin-top: 32px;
        }
        #content h1 {
            margin-top: 30px;
            font-size: 28px;
        }
        #content h2 {
            margin-top: 25px;
            font-size: 22px;
        }
        #content h3 {
            margin-top: 20px;
            font-size: 18px;
            font-weight: 500;
        }
        #content a {
            color: #555;
            text-decoration: underline;
            text-decoration-color: #ccc;
            text-underline-offset: 3px;
        }
        #content img {
            max-width: 100%;
            height: auto;
        }
        #content code {
            background-color: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: Monaco, Consolas, monospace;
            font-size: 14px;
        }
        #content pre {
            background-color: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        #content .math-display,
        #content mjx-container[jax="CHTML"][display="true"] {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0.4em 0;
        }
        #content blockquote {
            border-left: 4px solid #ddd;
            margin-left: 0;
            padding-left: 20px;
            color: #666;
        }
        #content ul, #content ol {
            margin: 15px 0;
            padding-left: 30px;
        }
        #content li {
            margin: 8px 0;
        }
        #content [data-footnote-ref] {
            padding: 0 0.15em;
            text-decoration: none;
        }
        #content .notebook-notes {
            margin-top: 40px;
            padding-top: 16px;
            border-top: 1px solid #eee;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }
        #content .notebook-notes h2 {
            margin: 0 0 16px;
            font-size: 16px;
        }
        #content .notebook-notes > ol {
            margin: 0;
            padding-left: 20px;
        }
        #content .notebook-notes > ol > li {
            margin: 0 0 16px;
        }
        #content .notebook-notes p {
            margin: 0 0 8px;
        }
        #content .notebook-notes > ol > li > :last-child {
            margin-bottom: 0;
        }
        #content [data-footnote-backref],
        #content [data-reference-backref] {
            white-space: nowrap;
            text-decoration: none;
        }
        #content [data-footnote-ref],
        #content [data-reference-ref],
        #content .sidenote {
            scroll-margin-top: 24px;
        }
        #content .sidenote:target {
            color: #333;
        }
        @media screen and (min-width: 1280px) {
            .entry-sections:not([hidden]) {
                display: block;
                position: absolute;
                top: 0;
                right: calc(100% + 48px);
                width: 200px;
                height: 100%;
            }
            .entry-sections > ol {
                position: sticky;
                top: 32px;
                max-height: calc(100vh - 64px);
                overflow-y: auto;
                margin: 0;
                padding: 0 0 0 12px;
                list-style: none;
                font-size: 13px;
                line-height: 1.5;
            }
            .entry-sections li {
                margin: 0 0 10px;
            }
            .entry-sections .section-subheading {
                padding-left: 12px;
            }
            .entry-sections a {
                position: relative;
                display: block;
                color: #777;
                text-decoration: none;
            }
            .entry-sections a:hover,
            .entry-sections a[aria-current="location"] {
                color: #333;
            }
            .entry-sections a[aria-current="location"]::before {
                content: '·';
                position: absolute;
                left: -12px;
            }
            #content.has-sidenotes {
                min-height: var(--sidenotes-height, 0px);
            }
            #content.has-sidenotes .notebook-notes {
                margin: 0;
                padding: 0;
                border: 0;
            }
            #content.has-sidenotes .notebook-notes h2 {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip-path: inset(50%);
                white-space: nowrap;
            }
            #content.has-sidenotes .notebook-notes > ol {
                padding: 0;
            }
            #content.has-sidenotes .sidenote {
                position: absolute;
                top: var(--sidenote-top);
                left: calc(100% + 48px);
                width: 200px;
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-link">
            <a href="notebooks.html">← All notebooks</a>
        </div>
        <header id="entry-header" class="entry-header" hidden>
            <h1 id="entry-title"></h1>
            <div id="entry-metadata"></div>
        </header>
        <div class="entry-body">
            <nav id="entry-sections" class="entry-sections" aria-label="Notebook sections" hidden></nav>
            <div id="content" aria-live="polite">
                <p style="color: #888;">Loading...</p>
            </div>
        </div>
        <footer id="entry-footer" class="entry-footer" hidden>
            <nav class="entry-nav" aria-label="Notebook navigation">
                <a id="nav-newer" href="notebooks.html" style="display: none;">← Newer</a>
                <a id="nav-older" href="notebooks.html" style="display: none;">Older →</a>
            </nav>
            <a id="entry-markdown" target="_blank" rel="noopener noreferrer">View Markdown</a>
        </footer>
        <noscript>
            <section aria-label="Notebook access for non-JavaScript agents" style="margin-top: 24px; color: #555;">
                <p>JavaScript is required to render the notebook in this viewer. You can still access every entry by opening the Markdown files directly.</p>
                <p>The <a href="notebooks/notebook-index.json">machine-readable notebook index</a> lists all available entries. Copy the <code>path</code> value into the browser address bar, for example <code>notebooks/2025-10-02-autoformalization-agents.md</code>, to read the raw Markdown.</p>
            </section>
        </noscript>
    </div>

    <script type="module">
        import { setupSidenotes } from './scripts/notebook-sidenotes.js';
        import { setupSections } from './scripts/notebook-sections.js';

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function setupMarkedMath() {
            if (!window.marked || typeof window.marked.use !== 'function') {
                return;
            }

            function isProbablyInlineMath(text) {
                const t = String(text || '');
                if (!t) {
                    return false;
                }
                if (/^[0-9][0-9,.\s]*$/.test(t)) {
                    // Avoid turning $100 into math.
                    return false;
                }
                if (/[\\_^{}]/.test(t)) {
                    return true;
                }
                if (/^[A-Za-z]$/.test(t)) {
                    return true;
                }
                // Equations/expressions.
                if (/[A-Za-z]/.test(t) && /[=<>+\-*/]/.test(t)) {
                    return true;
                }
                return false;
            }

            marked.use({
                extensions: [
                    {
                        name: 'texEnvBlock',
                        level: 'block',
                        start(src) {
                            const idx = src.indexOf('\\begin{');
                            return idx >= 0 ? idx : undefined;
                        },
                        tokenizer(src) {
                            const match = src.match(/^\\begin\{(align\*?|equation\*?|gather\*?|multline\*?)\}\s*\n([\s\S]*?)\n\\end\{\1\}\s*(?:\n|$)/);
                            if (!match) {
                                return;
                            }
                            const full = match[0];
                            return {
                                type: 'texEnvBlock',
                                raw: full,
                                text: full.trim()
                            };
                        },
                        renderer(token) {
                            return `<div class="math-display">${escapeHtml(token.text)}</div>\n`;
                        }
                    },
                    {
                        name: 'mathInline',
                        level: 'inline',
                        start(src) {
                            const idx = src.indexOf('$');
                            return idx >= 0 ? idx : undefined;
                        },
                        tokenizer(src) {
                            if (!src || src[0] !== '$' || src.startsWith('$$')) {
                                return;
                            }
                            const match = src.match(/^\$([^\n$]+?)\$/);
                            if (!match) {
                                return;
                            }
                            const text = match[1];
                            if (!isProbablyInlineMath(text)) {
                                return;
                            }
                            return {
                                type: 'mathInline',
                                raw: match[0],
                                text
                            };
                        },
                        renderer(token) {
                            const text = String(token.text || '').trim();
                            if (!text) {
                                return '';
                            }
                            return `<span class="math-inline">\\(${escapeHtml(text)}\\)</span>`;
                        }
                    }
                ]
            });
        }

        async function typesetMath(rootEl) {
            if (!rootEl) {
                return;
            }

            // MathJax loads async; wait briefly.
            const start = Date.now();
            while (Date.now() - start < 4000) {
                if (window.MathJax && window.MathJax.typesetPromise) {
                    break;
                }
                await new Promise((resolve) => setTimeout(resolve, 50));
            }

            if (!window.MathJax || typeof window.MathJax.typesetPromise !== 'function') {
                return;
            }

            try {
                if (window.MathJax.startup && window.MathJax.startup.promise) {
                    await window.MathJax.startup.promise;
                }
                await window.MathJax.typesetPromise([rootEl]);
            } catch (error) {
                console.warn('MathJax typeset failed:', error);
            }
        }

        setupMarkedMath();
        marked.use(markedFootnote({ headingClass: '' }));

        function formatDateIso(isoDate) {
            const raw = String(isoDate || '').trim();
            if (!/^\d{4}-\d{2}-\d{2}$/.test(raw)) {
                return raw;
            }
            return new Date(raw).toLocaleDateString('en-GB', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                timeZone: 'UTC'
            });
        }

        let notebookIndexPromise = null;

        function fetchNotebookIndex() {
            if (notebookIndexPromise) {
                return notebookIndexPromise;
            }

            notebookIndexPromise = fetch('notebooks/notebook-index.json', { cache: 'no-store' })
                .then((response) => {
                    if (!response.ok) {
                        throw new Error(`Notebook index fetch failed (${response.status})`);
                    }
                    return response.json();
                })
                .then((data) => {
                    const entries = Array.isArray(data && data.entries) ? data.entries.slice() : [];
                    entries.sort((a, b) => {
                        const dateA = a.date || '';
                        const dateB = b.date || '';
                        if (dateA && dateB && dateA !== dateB) {
                            return dateB.localeCompare(dateA);
                        }
                        if (dateA && !dateB) {
                            return -1;
                        }
                        if (!dateA && dateB) {
                            return 1;
                        }
                        const titleA = a.title || '';
                        const titleB = b.title || '';
                        return titleA.localeCompare(titleB);
                    });
                    return entries;
                });

            return notebookIndexPromise;
        }

        function findNotebookIndexEntry(entries, entryPath) {
            const normalized = String(entryPath || '').replace(/^\/+/, '');
            let index = entries.findIndex((e) => e && e.path === normalized);
            if (index !== -1) {
                return index;
            }
            const filename = normalized.split('/').pop();
            index = entries.findIndex((e) => e && typeof e.path === 'string' && e.path.split('/').pop() === filename);
            return index;
        }

        function setNavLink(el, entry, label) {
            if (!el) {
                return;
            }
            if (!entry || !entry.path) {
                el.style.display = 'none';
                el.removeAttribute('href');
                return;
            }
            el.style.display = '';
            el.href = `notebook-viewer.html?entry=${encodeURIComponent(entry.path)}`;
            el.textContent = label;
            el.title = entry.title || '';
        }

        function renderNotebookMetadata(entry) {
            const metadataDiv = document.getElementById('entry-metadata');
            if (!metadataDiv) {
                return;
            }

            metadataDiv.innerHTML = '';
            const p = document.createElement('p');
            p.className = 'entry-meta';

            function addSep() {
                p.appendChild(document.createTextNode(' · '));
            }

            if (entry.date) {
                const time = document.createElement('time');
                time.dateTime = entry.date;
                time.textContent = formatDateIso(entry.date);
                p.appendChild(time);
            }

            if (entry && entry.collection) {
                if (p.childNodes.length > 0) {
                    addSep();
                }
                const a = document.createElement('a');
                a.href = `notebooks.html?collection=${encodeURIComponent(entry.collection)}`;
                a.textContent = entry.collection;
                p.appendChild(a);
            }

            metadataDiv.appendChild(p);
        }

        function enhanceNotebookContext(entryPath) {
            fetchNotebookIndex()
                .then((entries) => {
                    const idx = findNotebookIndexEntry(entries, entryPath);
                    if (idx === -1) {
                        return;
                    }
                    const newer = idx > 0 ? entries[idx - 1] : null;
                    const older = idx + 1 < entries.length ? entries[idx + 1] : null;

                    setNavLink(document.getElementById('nav-newer'), newer, '← Newer');
                    setNavLink(document.getElementById('nav-older'), older, 'Older →');
                })
                .catch((error) => {
                    console.warn('Unable to enhance notebook context:', error);
                });
        }

        async function loadEntry() {
            const params = new URLSearchParams(window.location.search);
            // Back-compat: older links (and some tooling) used ?path=...
            const entryPath = params.get('entry') || params.get('path');

            if (!entryPath) {
                document.getElementById('content').innerHTML = '<p style="color: #888;">No entry specified.</p>';
                return;
            }

            try {
                const candidates = [];
                candidates.push(entryPath);
                if (window.location.hostname === 'jswachter.github.io') {
                    const filename = entryPath.split('/').pop();
                    candidates.push(`https://raw.githubusercontent.com/jswachter/jswachter.github.io/main/notebooks/${filename}`);
                }

                let text = '';
                let lastError = null;
                for (const url of candidates) {
                    try {
                        const response = await fetch(url, { cache: 'no-store' });
                        if (!response.ok) {
                            lastError = new Error(`Fetch failed (${response.status})`);
                            continue;
                        }
                        text = await response.text();
                        lastError = null;
                        break;
                    } catch (error) {
                        lastError = error;
                    }
                }
                if (lastError) {
                    throw lastError;
                }

                // Parse frontmatter
                const lines = text.split('\n');
                let title = '';
                let date = '';
                let collection = '';
                let contentStart = 0;

                if (lines[0] === '---') {
                    let i = 1;
                    while (i < lines.length && lines[i] !== '---') {
                        if (lines[i].startsWith('title:')) {
                            title = lines[i].substring(6).trim();
                        } else if (lines[i].startsWith('date:')) {
                            date = lines[i].substring(5).trim();
                        } else if (lines[i].startsWith('collection:')) {
                            collection = lines[i].substring(11).trim();
                        }
                        i++;
                    }
                    contentStart = i + 1;
                }

                // Render markdown content
                const markdownContent = lines.slice(contentStart).join('\n');
                const htmlContent = marked.parse(markdownContent);
                const contentEl = document.getElementById('content');
                contentEl.innerHTML = htmlContent;

                // Keep one title above the metadata, including for notes without frontmatter.
                const heading = contentEl.firstElementChild;
                if (heading && heading.tagName === 'H1') {
                    title = title || heading.textContent.trim();
                    heading.remove();
                }
                const titleEl = document.getElementById('entry-title');
                titleEl.textContent = title || 'Untitled notebook';
                document.title = titleEl.textContent + ' - Notebook';
                renderNotebookMetadata({ date, collection });
                titleEl.parentElement.hidden = false;

                document.getElementById('entry-markdown').href = entryPath;
                document.getElementById('entry-footer').hidden = false;
                enhanceNotebookContext(entryPath);

                const layoutSidenotes = setupSidenotes(contentEl);
                const updateSections = setupSections(contentEl, document.getElementById('entry-sections'));
                await typesetMath(contentEl);
                layoutSidenotes?.();
                updateSections?.();

                // Restore direct citation/equation links after async rendering
                // and math have settled, when their final positions are known.
                const target = document.getElementById(window.location.hash.slice(1))
                    || contentEl.querySelector(':target');
                if (target && contentEl.contains(target)) {
                    await document.fonts.ready;
                    layoutSidenotes?.();
                    requestAnimationFrame(() => target.scrollIntoView());
                }
            } catch (error) {
                console.error('Error loading entry:', error);
                document.getElementById('content').innerHTML = '<p style="color: #888;">Unable to load entry.</p>';
            }
        }

        // Load entry when page loads
        loadEntry();
    </script>
</body>
</html>
